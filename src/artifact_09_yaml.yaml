version: "3.8"

services:
  season-zero-oracle:
    build: .
    restart: always
    environment:
      - NODE_ENV=production
      - SOLANA_RPC_URL=https://api.mainnet-beta.solana.com
      - PROGRAM_ID=SznZero111111111111111111111111111111111111
      - SEASON_ID=0
      - ORACLE_PRIVATE_KEY=${ORACLE_PRIVATE_KEY}
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - NOTIFICATION_EMAIL=team@solanaprotocol.io
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3