version: '3.8'

services:
  quest-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: solana-pump-pool3-quest-engine
    restart: always
    environment:
      - PORT=8080
      - SOLANA_RPC_URL=https://api.devnet.solana.com
      - PROGRAM_ID=PumpZeroQuest11111111111111111111111111111111
      - DISCORD_WEBHOOK_URL=https://api.example.com/webhooks/alerts/placeholder
      - SLACK_WEBHOOK_URL=https://api.example.com/webhooks/alerts/placeholder
    ports:
      - "8080:8080"
    volumes:
      - ./artifacts:/app/artifacts