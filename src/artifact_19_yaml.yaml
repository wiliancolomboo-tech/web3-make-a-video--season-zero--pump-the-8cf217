version: "3.8"

services:
  auraquest-engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: auraquest_sentry
    restart: always
    environment:
      - SOLANA_RPC_URL=${SOLANA_RPC_URL}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}
      - RESEND_API_KEY=${RESEND_API_KEY}
    volumes:
      - ./videos:/usr/src/app/videos
      - ./keys:/usr/src/app/keys:ro
    ports:
      - "8080:8080"
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"