[package]
name = "season-zero-quests"
version = "0.1.0"
description = "Season Zero Pump the Pool and Social Quests Protocol"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "season_zero_quests"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = { version = "0.30.1", features = ["token", "associated_token"] }
solana-program = "=1.18.26"