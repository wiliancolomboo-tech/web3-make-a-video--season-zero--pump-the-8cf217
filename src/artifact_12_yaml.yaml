version: '3.8'

services:
  verifier-engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: season_zero_verifier
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
      - PORT=8080
      - SOLANA_RPC_URL=${SOLANA_RPC_URL}
      - ORACLE_SECRET_KEY_BASE64=${ORACLE_SECRET_KEY_BASE64}
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY}
      - RESEND_API_KEY=${RESEND_API_KEY}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"