[toolchain]
anchor_version = "0.30.1"
solana_version = "1.18.17"

[features]
seeds = true
skip-lint = false

[programs.devnet]
season_zero_quest = "SznZeroQuest11111111111111111111111111111111"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "devnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"
start-oracle = "ts-node service/quest_oracle_service.ts"