version: '3.8'

services:
  quest-oracle-relayer:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    environment:
      - NODE_ENV=production
      - SOLANA_RPC_URL=https://api.mainnet-beta.solana.com
      - ORACLE_PRIVATE_KEY_BASE58=${ORACLE_PRIVATE_KEY_BASE58}
      - PROGRAM_ID=PUMP3QuestZero11111111111111111111111111111
      - DISCORD_SLACK_WEBHOOK_URL=${DISCORD_SLACK_WEBHOOK_URL}
      - PORT=8080
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3