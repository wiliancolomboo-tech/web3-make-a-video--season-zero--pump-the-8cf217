[package]
name = "season_zero_engine"
version = "0.1.0"
description = "Solana Anchor Program for Season Zero: Pump the Pool 3 & Social Quests"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "season_zero_engine"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []

[dependencies]
anchor-lang = { version = "0.29.0", features = ["init-if-needed"] }
anchor-spl = { version = "0.29.0" }
solana-program = "1.17.0"